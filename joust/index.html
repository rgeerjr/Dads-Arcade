<!DOCTYPE html>
<html>
<head>
    <title>Joust Remake - Dad's Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Press Start 2P', cursive; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        /* THE ARCADE CABINET WRAP */
        .cabinet { width: 380px; background: #333; border: 10px solid #555; border-radius: 20px; box-shadow: 0 0 50px #000; position: relative; }
        .marquee { background: #ff00ff; padding: 15px; text-align: center; border-bottom: 5px solid #fff; text-shadow: 3px 3px #00ffff; font-size: 1.2rem; }
        .bezel { background: #000; padding: 15px; position: relative; }
        /* CRT SCANLINE EFFECT */
        .bezel::after { content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 3px, 3px 100%; pointer-events: none; }
        canvas { background: #000; width: 100%; display: block; image-rendering: pixelated; border: 2px solid #222; }
        .controls-art { background: #444; height: 60px; display: flex; justify-content: center; align-items: center; border-top: 5px solid #222; border-radius: 0 0 10px 10px; font-size: 0.6rem; color: #aaa; }
        /* UI OVERLAYS */
        #ui { position: absolute; top: 80px; width: 100%; text-align: center; pointer-events: none; }
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 4px solid #ff00ff; padding: 20px; text-align: center; z-index: 10; width: 80%; }
        input { font-family: 'Press Start 2P'; width: 80%; margin: 10px 0; padding: 5px; text-align: center; }
        button { font-family: 'Press Start 2P'; background: #ff00ff; color: white; border: none; padding: 10px; cursor: pointer; margin-top: 5px; width: 100%; }
    </style>
</head>
<body>

<div class="cabinet">
    <div class="marquee">JOUST</div>
    <div class="bezel">
        <canvas id="game" width="320" height="400"></canvas>
        <div id="ui">SCORE: <span id="scoreVal">0</span></div>
        <div id="game-over">
            <h2 style="color:#ff00ff">GAME OVER</h2>
            <p style="font-size:0.5rem">ENTER NAME:</p>
            <input type="text" id="playerName" maxlength="10" placeholder="AAA">
            <button onclick="saveScore()">SAVE & QUIT</button>
        </div>
    </div>
    <div class="controls-art">SPACE TO FLAP</div>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let score = 0;
    let gameActive = true;

    // Player Physics
    let p = { x: 160, y: 200, vy: 0, vx: 0, size: 10 };
    const gravity = 0.15;
    const flap = -3.5;

    function draw() {
        if (!gameActive) return;
        ctx.fillStyle = "black";
        ctx.fillRect(0,0,320,400);

        // Physics
        p.vy += gravity;
        p.y += p.vy;
        
        // Floor (Lava)
        if (p.y > 390) endGame();

        // Draw Player (The Bird)
        ctx.fillStyle = "yellow";
        ctx.fillRect(p.x - 5, p.y - 5, 10, 10);
        ctx.fillStyle = "red";
        ctx.fillRect(p.x + 2, p.y - 7, 5, 5); // Beak

        score++;
        document.getElementById('scoreVal').innerText = score;
        requestAnimationFrame(draw);
    }

    window.addEventListener('keydown', (e) => { if(e.code === 'Space') p.vy = flap; });
    function endGame() { gameActive = false; document.getElementById('game-over').style.display = 'block'; }

    // SUPABASE CONNECTION
    const SB_URL = "YOUR_SUPABASE_URL";
    const SB_KEY = "YOUR_SUPABASE_KEY";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    async function saveScore() {
        const name = document.getElementById('playerName').value || "ANON";
        await supabaseClient.from('leaderboards').insert([{ game_slug: 'joust', player_name: name, score: score }]);
        window.location.href = "../";
    }

    draw();
</script>
</body>
</html>
