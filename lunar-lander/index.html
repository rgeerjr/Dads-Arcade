<!DOCTYPE html>
<html>
<head>
    <title>Lunar Lander - Dad's Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Press Start 2P', cursive; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* THE ARCADE CABINET WRAP */
        .cabinet { width: 380px; background: #2c3e50; border: 10px solid #1a252f; border-radius: 20px; box-shadow: 0 0 50px #000; position: relative; }
        .marquee { background: #f1c40f; color: #000; padding: 15px; text-align: center; border-bottom: 5px solid #fff; text-shadow: 1px 1px #fff; font-size: 1rem; }
        .bezel { background: #000; padding: 15px; position: relative; }
        
        /* CRT SCANLINE EFFECT */
        .bezel::after { content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 3px; pointer-events: none; }
        
        canvas { background: #000; width: 100%; display: block; border: 1px solid #333; }
        .controls-art { background: #34495e; height: 60px; display: flex; justify-content: center; align-items: center; border-top: 5px solid #222; font-size: 0.5rem; color: #ecf0f1; text-align: center; line-height: 1.4; }
        
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 4px solid #f1c40f; padding: 20px; text-align: center; z-index: 10; width: 85%; box-sizing: border-box; }
        input { font-family: 'Press Start 2P'; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; font-size: 0.7rem; text-align: center; }
        button { font-family: 'Press Start 2P'; background: #f1c40f; color: black; border: none; padding: 12px; cursor: pointer; width: 100%; }
        
        .stats { position: absolute; top: 20px; left: 25px; font-size: 0.5rem; line-height: 1.5; pointer-events: none; color: #0f0; }
    </style>
</head>
<body>

<div class="cabinet">
    <div class="marquee">LUNAR LANDER</div>
    <div class="bezel">
        <canvas id="landerCanvas" width="320" height="400"></canvas>
        <div class="stats">
            FUEL: <span id="fuel">1000</span><br>
            V-SPD: <span id="vspd">0.0</span><br>
            H-SPD: <span id="hspd">0.0</span>
        </div>
        <div id="game-over">
            <h2 id="status-text" style="color:#f1c40f; font-size: 1rem;">CRASHED!</h2>
            <p id="score-text" style="font-size:0.6rem">SCORE: 0</p>
            <input type="text" id="playerName" maxlength="10" placeholder="NAME">
            <button onclick="saveScore()">SAVE SCORE</button>
        </div>
    </div>
    <div class="controls-art">ARROWS TO ROTATE & THRUST<br>LAND GENTLY ON GREEN PAD</div>
</div>

<script>
    const canvas = document.getElementById('landerCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game state
    let ship = { x: 50, y: 50, vx: 1.2, vy: 0, angle: 0, fuel: 1000 };
    let gravity = 0.015;
    let thrust = 0.04;
    let rotationSpeed = 0.05;
    let gameActive = true;
    let finalScore = 0;

    // Terrain
    const pad = { x: 180, w: 40, y: 360 };
    const stars = Array.from({length: 30}, () => ({x: Math.random()*320, y: Math.random()*400}));

    const keys = {};
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;

    function draw() {
        if (!gameActive) return;

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, 320, 400);

        // Stars
        ctx.fillStyle = "white";
        stars.forEach(s => ctx.fillRect(s.x, s.y, 1, 1));

        // Update Physics
        if (keys['ArrowLeft']) ship.angle -= rotationSpeed;
        if (keys['ArrowRight']) ship.angle += rotationSpeed;
        if (keys['ArrowUp'] && ship.fuel > 0) {
            ship.vx += Math.sin(ship.angle) * thrust;
            ship.vy -= Math.cos(ship.angle) * thrust;
            ship.fuel -= 2;
            // Draw thrust flame
            ctx.strokeStyle = "orange";
            ctx.beginPath();
            ctx.moveTo(ship.x, ship.y);
            ctx.lineTo(ship.x - Math.sin(ship.angle)*15, ship.y + Math.cos(ship.angle)*15);
            ctx.stroke();
        }
        
        ship.vy += gravity;
        ship.x += ship.vx;
        ship.y += ship.vy;

        // Draw Terrain
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 380); ctx.lineTo(100, 350); ctx.lineTo(pad.x, pad.y);
        ctx.lineTo(pad.x + pad.w, pad.y); ctx.lineTo(320, 370);
        ctx.stroke();
        
        // Landing Pad
        ctx.strokeStyle = "#0f0";
        ctx.strokeRect(pad.x, pad.y, pad.w, 2);

        // Draw Ship
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.strokeStyle = "white";
        ctx.beginPath();
        ctx.moveTo(-5, 5); ctx.lineTo(0, -10); ctx.lineTo(5, 5); ctx.closePath();
        ctx.stroke();
        ctx.restore();

        // Update UI
        document.getElementById('fuel').innerText = Math.max(0, Math.floor(ship.fuel));
        document.getElementById('vspd').innerText = Math.abs(ship.vy).toFixed(1);
        document.getElementById('hspd').innerText = Math.abs(ship.vx).toFixed(1);

        // Collision Check
        if (ship.y >= 350) {
            checkLanding();
        } else if (ship.x < 0 || ship.x > 320) {
            endGame("OFF COURSE!", 0);
        } else {
            requestAnimationFrame(draw);
        }
    }

    function checkLanding() {
        // Did we hit the pad?
        const onPad = (ship.x > pad.x && ship.x < pad.x + pad.w);
        const slowEnough = (Math.abs(ship.vy) < 1.5 && Math.abs(ship.vx) < 1.0);
        const upright = (Math.abs(ship.angle) < 0.3);

        if (onPad && slowEnough && upright) {
            finalScore = Math.floor(ship.fuel + 500);
            endGame("SAFE LANDING!", finalScore);
        } else {
            endGame("CRASHED!", 0);
        }
    }

    function endGame(text, score) {
        gameActive = false;
        finalScore = score;
        document.getElementById('status-text').innerText = text;
        document.getElementById('score-text').innerText = "SCORE: " + score;
        document.getElementById('game-over').style.display = 'block';
    }

    // SUPABASE SETUP
    const SB_URL = "YOUR_SUPABASE_URL";
    const SB_KEY = "YOUR_SUPABASE_KEY";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    async function saveScore() {
        const name = document.getElementById('playerName').value || "PILOT";
        await supabaseClient.from('leaderboards').insert([{ 
            game_slug: 'lunar-lander', 
            player_name: name, 
            score: finalScore 
        }]);
        window.location.href = "../";
    }

    draw();
</script>
</body>
</html>
